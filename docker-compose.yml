version: '3.8'

services:

  # -------------------------------------------------------
  # Service 1: SQL Server avec init automatique du schema
  # -------------------------------------------------------
  db:
    build:
      context: .
      dockerfile: Dockerfile.sqlserver
    environment:
      SA_PASSWORD: "GestionC0mpt3urs!Docker"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "GestionC0mpt3urs!Docker", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------
  # Service 2: API .NET 8
  # -------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5141:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Override la connection string pour pointer vers le service 'db'
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=GestionCompteursDB;User Id=sa;Password=GestionC0mpt3urs!Docker;TrustServerCertificate=True;MultipleActiveResultSets=true"
      ASPNETCORE_URLS: "http://+:80"
      Jwt__Key: "SuperSecretKeyWhichIsLongEnoughForHmacSha256!!!"
      Jwt__Issuer: "GestionCompteursAPI"
      Jwt__Audience: "GestionCompteursUsers"
      Jwt__DurationInMinutes: "1440"

  # -------------------------------------------------------
  # Service 3: Frontend React (nginx)
  # -------------------------------------------------------
  frontend:
    build:
      context: ./gestion-compteurs-frontend
      dockerfile: Dockerfile
      args:
        # L'URL de l'API vue depuis le navigateur du testeur
        REACT_APP_API_URL: "http://localhost:5141/api"
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
